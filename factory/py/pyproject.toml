[project]
name = "skill-factory-langgraph-host"
version = "0.2.0"
description = "LangGraph host for the skill factory and its integration tests"
requires-python = ">=3.13"
dependencies = [
  "langgraph==1.2.20",
  "langchain-mcp-adapters==0.3.2",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
