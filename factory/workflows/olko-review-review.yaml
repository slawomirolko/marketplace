name: olko-review-review
version: 0.1.0
description: "REVIEW route: a read-only review of someone else's PR or a fresh review of your own, from scope to posted comments."
source: "agents/opencode/olko-review-orchestrator.md (REVIEW ROUTE)"
entry: review-scope
limits:
  maxCycleIterations: 3
nodes:
  - id: review-scope
    description: "Reads the PR (title, body, diff) and picks the lenses: bugs, one stack lens per changed stack, requirements when the PR states criteria."
    kind: group
    workflow: olko-review-scope
  - id: memory
    description: "Loads the review memory: patterns to suppress (rejected twice) and to prioritize (confirmed once)."
    kind: script
    op: memory.load
    with: { agent: olko-review-orchestrator }
  - id: ask-memory
    description: "Asks whether to continue without a memory block."
    kind: interrupt
    question:
      id: q-memory-missing
      text: "The review memory block {{state.memory.file}} does not exist. Fix: install the agent memory with `node scripts/install-opencode-agents.mjs --project <project> --agent olko-review-orchestrator`. Continue this review without memory, or stop?"
      allowed: [continue, stop]
  - id: review-findings
    description: "Runs the lenses in parallel on the diff, merges their findings and lets the verifier confirm or reject each one."
    kind: group
    workflow: olko-review-findings
  - id: review-rules
    description: "Checks the confirmed findings against the project rule store, verifies new violations and asks the user one question per conflict between a finding and the store."
    kind: group
    workflow: olko-review-rules
  - id: review-post
    description: "Ranks the kept findings, asks post or skip for each one, posts one PR comment per post and records the decisions in the lens memory."
    kind: group
    workflow: olko-review-post
edges:
  - { from: review-scope, to: memory }
  - { from: memory, to: review-findings, when: "memory.loaded == true" }
  - { from: memory, to: ask-memory, when: "memory.loaded == false", description: "no memory block yet" }
  - { from: ask-memory, to: review-findings, when: 'ask-memory.answer == "continue"' }
  - { from: ask-memory, to: END, when: 'ask-memory.answer == "stop"', description: "you chose stop" }
  - { from: review-findings, to: review-rules }
  - { from: review-rules, to: review-post }
  - { from: review-post, to: END }
