name: olko-skill-sync-publish
version: 0.4.0
description: "Phase 5 and the order of phase 6: validates the marketplace, publishes through olko-commit after approval, then leave, wait for CI or squash merge, installs after the merge, and only then starts the separate local project pull request; verified flow memory is saved last. A run with only local reverts skips the marketplace pull request and goes straight to the local delivery. A stop makes no marketplace pull request and ends the run without a local delivery, so nothing is reported complete while only one of the two deliveries exists."
source: "agents/opencode/olko-marketplace-skill-sync-manager.md (phase 5, two-pull-request contract, phase 6 order)"
roles:
  publisher: medium
entry: validate
limits:
  maxCycleIterations: 3
nodes:
  - id: validate
    description: "Runs registry --fix, the agent installer check and the marketplace node tests."
    kind: script
    op: sync.validate
  - id: ask-publish
    description: "Shows the diff, versions and validation; asks before commit and push."
    kind: interrupt
    question:
      id: q-sync-publish
      text: "Marketplace diff:\n{{state.validate.status}}\n{{state.validate.diffStat}}\n\nVersions:\n{{state.validate.versions}}\n\nValidation: {{state.validate.summary}}\n\nCommit and push on a feature branch and open a PR? Stop: no marketplace PR is made and the run ends without a local delivery, so it is not reported complete."
      allowed: [publish, stop]
  - id: publish
    description: "olko-commit commits on a feature branch, pushes and opens the PR."
    kind: llm
    role: publisher
    skill: olko-commit
    tools: [read, edit, bash]
    dirs: ["{{state.resolve-path.path}}"]
    parse: sync.prLine
    prompt: |
      Run the olko-commit workflow in the marketplace repository {{state.resolve-path.path}} (use `git -C` or change into it), not in the current directory.
      Never pass --force, never push to main: use its scope-named feature branch and PR flow. Do not merge. Do not ask questions; the user already approved this publish.
      PR title: the conventional commit subject for this change, for example `feat(sync): {{#state.plan.accepted}}{{name}} {{/state.plan.accepted}}`.
      PR description, concise: the artifacts and versions below, and the validation result. Carry only portable artifacts: never include project adapters, `.agents/skill-config.md`, local-only SemVer lines, permission narrowing, opencode.json changes, machine paths or credentials; those belong to the separate local pull request.
      {{state.validate.versions}}
      Validation: {{state.validate.summary}}

      End with exactly one line: `pr | <PR URL> | <branch> | <commit sha>`.
  - id: publish-pr
    description: "Reads the PR URL and branch from the publish output."
    kind: script
    op: sync.prOf
  - id: pr
    description: "Calls the shared PR step: leave, wait for CI or squash merge."
    kind: call
    workflow: olko-pr-merge
    input: { path: "{{state.resolve-path.path}}", prUrl: "{{state.publish-pr.publish.url}}", prBranch: "{{state.publish-pr.publish.branch}}", label: "marketplace" }
  - id: pr-outcome
    description: "Branches on the PR answer: install only after a merge."
    kind: script
    op: builtin.pass
  - id: install-phase
    description: "Installs the merged artifacts from origin/main into the project."
    kind: group
    workflow: olko-skill-sync-install
  - id: local-phase
    description: "Phase 6: after the marketplace pull request is merged and reinstalled, or directly after a run with only local reverts (no marketplace pull request), shows the local diff, asks before commit and opens the separate local pull request."
    kind: group
    workflow: olko-skill-sync-local
  - id: memory-gate
    description: "Passes the run on after the local delivery; it decides in the next edges whether a marketplace change was installed and so has verified decisions to record."
    kind: script
    op: builtin.pass
  - id: memory-save
    description: "Records the verified decisions in the sync memory after both deliveries and the verified installation."
    kind: script
    op: sync.memorySave
edges:
  - { from: validate, to: ask-publish, when: "validate.changed > 0", description: "the marketplace changed" }
  - { from: validate, to: local-phase, when: "validate.changed == 0", description: "only local reverts: no marketplace pull request is made, so only the local delivery runs" }
  - { from: ask-publish, to: publish, when: 'ask-publish.answer == "publish"', description: "you chose publish" }
  - { from: ask-publish, to: END, when: 'ask-publish.answer == "stop"', description: "you chose stop: no marketplace pull request is made, the marketplace changes stay unpublished, nothing is installed and no local delivery runs, so the run is not reported complete" }
  - { from: publish, to: publish-pr }
  - { from: publish-pr, to: pr }
  - { from: pr, to: pr-outcome }
  - { from: pr-outcome, to: install-phase, when: 'pr.ask-pr.answer == "merge"', description: "the marketplace pull request was merged" }
  - { from: pr-outcome, to: END, description: "marketplace pull request is open and left or waiting: it is not merged, nothing is installed, and local delivery waits for the merge" }
  - { from: install-phase, to: local-phase, description: "reinstall is verified, so the local pull request may follow" }
  - { from: local-phase, to: memory-gate, description: "the local delivery finished (pull request left open, waited for or merged)" }
  - { from: memory-gate, to: memory-save, when: "validate.changed > 0", description: "a marketplace change was installed, so the verified decisions are saved to memory after the local delivery" }
  - { from: memory-gate, to: END, description: "a revert-only run has no installed marketplace change, so memory is not saved and the run ends after the local delivery" }
  - { from: memory-save, to: END }
