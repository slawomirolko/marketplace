name: olko-skill-optimizer-propose
version: 0.3.1
description: "Propose phase for optimize and split: runs the optimizer skill on the selected resource (read only), applies the language profile after the structural decisions, resolves the advisor testsRoot (the marketplace checkout, or asks), asks the test coverage advisor for missing tests (suggest mode), drafts one proposal with findings, wording changes, split plan, expected size and test advice, and puts the exact text to you. Revise runs the analysis again; approve or stop ends the phase. Nothing is edited here."
source: "agents/opencode/olko-skill-optimizer.md (required skill sequence, steps 2-4, approval and editing)"
roles:
  optimizer: medium
  auditor: medium
limits:
  maxCycleIterations: 4
entry: analyze
nodes:
  - id: analyze
    description: "Runs the optimizer skill on the selected resource, read only: discoverability and gotchas, token and cache audit (prefix stability, placement, examples over rules, split plan, provider advice). The measure step is not available yet and is reported as needs engine op."
    kind: llm
    role: optimizer
    skill: olko-agents-optimizer
    tools: [read]
    dirs: ["{{state.resolve-path.resolve-path.path}}"]
    maxVisits: 4
    parse: text
    prompt: |
      Read only. Do not edit, create or delete any file in this step.
      Mode: {{state.ask-mode.answer}}
      Selected resource (exact path, the only target): {{state.ask-target.answer}}
      Memory lessons for this agent: {{state.memory-read.memory-read}}
      Limits: Do not inspect or recommend edits to Cave Crew resources. Do not read or search `plans/` unless the user named a plan file.

      Run the optimizer steps in this order: measure, discoverability and gotchas, token and cache audit, split plan, provider advice.
      Measure step: the line-count measurement is not available in this workflow yet. Write `measure | needs engine op skill.measure` in its place. Do not estimate words, tokens or prefix issues.
      Keep every rule that the resource needs on every model step in the resource; do not move it into a skill. Never change behavior: keep frontmatter, invocation contracts, tools, permissions, commands, paths, thresholds and hard rules.
      Reply with the findings for each step, then the split plan (or `split: none`) and the provider advice.
  - id: wording
    description: "Applies the language profile of the ASD-STE100 adapter to the proposed wording, after the structural decisions, and adds related skill and agent recommendations. Read only."
    kind: llm
    role: optimizer
    skill: olko-ste100-skill-adapter
    tools: [read]
    dirs: ["{{state.resolve-path.resolve-path.path}}"]
    maxVisits: 4
    parse: text
    prompt: |
      Read only. Do not edit any file.
      Limits: Do not inspect or recommend edits to Cave Crew resources. Do not read or search `plans/` unless the user named a plan file.
      Apply your language profile to the proposed wording of the resource at {{state.ask-target.answer}}. The structural decisions below are fixed; the language profile must not undo them.
      Structural findings from the optimizer:
      {{state.analyze.analyze}}

      Rules: ASD-STE100 applies only to English text: say so and label it conformant only when it is. For Polish prose, use the Polish clarity profile from the adapter and say it is clarity guidance inspired by STE, never formally ASD-STE100 compliant. Note any wording that could disadvantage or exclude a group of users.
      Reply with the wording changes (old text, new text, reason), the conformance label, and the related skill and agent recommendations. Mark every recommendation as a draft for the user to decide.
  - id: tests-root
    description: "Read only: finds the advisor's testsRoot, the marketplace checkout, in the sync manager's order (input marketplace, MARKETPLACE_PATH, project adapter), or a project root when your request asks to check that project's tests. Replies with the plain path, or exactly none so the next step asks you; the reply is kept as text, so a malformed reply never fails the run."
    kind: llm
    role: optimizer
    agent: olko-skill-optimizer
    tools: [read, bash]
    maxVisits: 4
    parse: text
    prompt: |
      Read only. Do not write anything. Find the testsRoot for the test coverage advisor.
      Run goal: {{goal}}
      When the run goal explicitly asks to check the tests of a project root instead of the marketplace, use that project root and stop here.
      Otherwise find the marketplace checkout in this order, and take the first one that gives a path:
      1. the marketplace path given in this run: {{input.marketplace}}{{^input.marketplace}}none{{/input.marketplace}};
      2. the `MARKETPLACE_PATH` environment variable;
      3. `.opencode/marketplace-path.local.json` (field `marketplacePath`) in the current project.
      Check that the path exists and is a Git repository (`git -C <path> rev-parse --is-inside-work-tree`); skip a path that is not. Do not guess a default path.

      Reply with only the absolute path, or exactly `none` when none is found. No other text, no quotes, no code block.
  - id: ask-tests-root
    description: "Asks for the advisor's testsRoot when no marketplace checkout was found: the marketplace checkout, or a project root when you want that project's tests checked."
    kind: interrupt
    askedBy: tests-root
    maxVisits: 4
    question:
      id: q-skill-optimizer-tests-root
      text: "The test coverage advisor needs a testsRoot, and no marketplace checkout was found (input, MARKETPLACE_PATH, .opencode/marketplace-path.local.json). Give the absolute path of the marketplace checkout, or a project root when you want that project's tests checked. The advisor never blocks the optimization."
  - id: advise
    description: "The test coverage advisor suggests missing tests for the selected resource (suggest mode, read only) in the resolved testsRoot. Its reply is kept as text, so a malformed reply never fails the run; it never blocks the optimization."
    kind: llm
    role: auditor
    agent: olko-test-coverage-advisor
    tools: [read, bash]
    dirs: ["{{state.resolve-path.resolve-path.path}}", "{{#state.ask-tests-root.answer}}{{state.ask-tests-root.answer}}{{/state.ask-tests-root.answer}}{{^state.ask-tests-root.answer}}{{state.tests-root.tests-root}}{{/state.ask-tests-root.answer}}"]
    maxVisits: 4
    parse: text
    prompt: |
      Mode: suggest. Read only: change nothing.
      testsRoot: {{#state.ask-tests-root.answer}}{{state.ask-tests-root.answer}}{{/state.ask-tests-root.answer}}{{^state.ask-tests-root.answer}}{{state.tests-root.tests-root}}{{/state.ask-tests-root.answer}}
      artifacts: {{state.ask-target.answer}}

      Follow your `suggest` steps for this one artifact. Use `<artifact-name>#TP<n>` as the suggestion id. When you cannot tell whether a principle applies, say so in `reason`.
      End with one ```json block:
      {"artifact": "<skill|agent>:<name>", "suggestions": [{"id": "<name>#TP<n>", "principle": "TP<n>", "status": "<partial|missing>", "severity": "<high|medium|low>", "evidence": "<path:line>", "scenario": "<one sentence>", "targetFile": "<path in testsRoot>", "sketch": "<test sketch>"}], "covered": ["TP<n>"], "notApplicable": [{"principle": "TP<n>", "reason": "<reason>"}]}
  - id: draft
    description: "Combines the findings, wording changes, split plan and expected size into one proposal, marked as draft for your review. Read only."
    kind: llm
    role: optimizer
    agent: olko-skill-optimizer
    tools: [read]
    dirs: ["{{state.resolve-path.resolve-path.path}}"]
    maxVisits: 4
    parse: text
    prompt: |
      Read only. Do not edit any file. Write the proposal text only.
      Limits: Do not inspect or recommend edits to Cave Crew resources. Do not read or search `plans/` unless the user named a plan file.
      Language: write the proposal in the user's language, and keep the target's own language requirement (ASD-STE100 applies only to English text; Polish text gets the Polish clarity profile, never a formal ASD-STE100 label).
      Mode: {{state.ask-mode.answer}}
      Target: {{state.ask-target.answer}}
      Findings and split plan:
      {{state.analyze.analyze}}
      Wording and recommendations:
      {{state.wording.wording}}
      Test coverage advisor report (suggest mode, free text that should end with a JSON block):
      {{state.advise.advise}}

      Write one proposal with these parts, in this order:
      1. Target: the exact path.
      2. Findings table: finding, location, rule or section, action, reason.
      3. Wording changes: old text, new text, reason.
      4. Split plan: for each new skill, its name, the section it takes, the one-line load instruction left in the agent, the permission.skill and manifest entries it needs, and the registry entry. Write `none` when there is no split.
      5. Expected words and tokens after the change: write `needs engine op skill.measure` when the measure step was not available; do not estimate.
      6. Related skill and agent recommendations.
      7. Test advice: every advisor suggestion with its id, principle, status, severity, scenario and target file, and the testsRoot. Write `none` when the advisor has no suggestions or its report cannot be read. Approval covers every suggestion id listed here; the advisor writes those tests in apply mode, before the repository tests run.
      8. Edit list: the exact files and the exact changes you will make after approval, and nothing else.
      Check the proposal for company, team, product or internal repository names when the target is in a public repository. If you find one, do not propose any edit; write the hit as the only finding and stop.
      Mark the whole proposal as draft material that a responsible person must review and validate before any edit.
  - id: approve
    description: "Puts the exact proposal to you. Approve allows the listed edits only; revise runs the analysis again; stop changes nothing."
    kind: interrupt
    askedBy: draft
    maxVisits: 4
    question:
      id: q-skill-optimizer-approve
      text: "Skill optimizer proposal (draft for your review):\n{{state.draft.draft}}\n\nApprove these exact edits, revise (a new draft is made), or stop (nothing is edited)?"
      allowed: [approve, revise, stop]
edges:
  - { from: analyze, to: wording, description: "findings ready: apply the language profile" }
  - { from: wording, to: tests-root, description: "wording ready: find the advisor's testsRoot" }
  - { from: tests-root, to: ask-tests-root, when: 'tests-root.tests-root == "none"', description: "no marketplace checkout found: ask for the testsRoot" }
  - { from: tests-root, to: advise, description: "testsRoot found: ask the test coverage advisor for missing tests" }
  - { from: ask-tests-root, to: advise, description: "testsRoot given: ask the test coverage advisor for missing tests" }
  - { from: advise, to: draft, description: "test advice ready: combine into one proposal; the advisor never blocks" }
  - { from: draft, to: approve, description: "proposal ready: put it to you" }
  - { from: approve, to: analyze, when: 'approve.answer == "revise"', description: "you asked to revise: run the analysis again" }
  - { from: approve, to: END, description: "you approved or stopped: leave the phase; the caller reads your answer" }
