name: olko-implementation
version: 0.4.0
description: "Implements one approved Task: entry gate (plans it first when no plan exists), worktree and journal, acceptance E2E baseline, compatibility preflight, failing tests first, chunked implementation with child-result checks, style and tests, isolated runtime verification, context-file optimization, scope gate, local Task review, then commit, PR, gates, merge and closure after explicit approvals. Planning questions to you pass the question gate (question reviewer, then grill-with-docs) when the project adapter sets it."
source: "agents/opencode/olko-implementation-orchestrator.md (ENTRY GATE, QUESTION GATE, DELTA CLOSURE) and skills/workflow/olko-task-implementation-workflow/SKILL.md (workflow.md gates 1-13; each phase is a group file; tracker, Docker, Obsidian, editor and adoption sit behind switches)"
entry: entry
roles:
  orchestrator: medium
limits:
  maxCycleIterations: 4
nodes:
  - id: entry
    description: "Entry gate: an approved Task plan with acceptance criteria; without one, plan documentation runs first."
    kind: group
    workflow: olko-impl-entry
  - id: workspace
    description: "Creates or resumes the Task worktree, adopts existing changes when asked, and starts the journal and Feature tracker."
    kind: group
    workflow: olko-impl-workspace
  - id: preflight-phase
    description: "Step 2: four read-only investigation workers check the plan against current code; only four PASS results allow implementation."
    kind: group
    workflow: olko-impl-preflight
  - id: tests-first
    description: "Step 3a: one failing test per acceptance criterion, per stack, before any production code."
    kind: group
    workflow: olko-impl-tests-first
  - id: build
    description: "Step 3b: the Task is split into small chunks; one stack implementer per chunk, with child-result checks, test disputes, edge cases and blocked decisions."
    kind: group
    workflow: olko-impl-build
  - id: verify
    description: "Steps 4-7: style and affected tests until they pass, the acceptance E2E recheck (5a), then the isolated Docker rebuild and runtime evidence."
    kind: group
    workflow: olko-impl-verify
  - id: context
    description: "Step 7a: agent-context files the Task changed are optimized after your confirmation."
    kind: group
    workflow: olko-impl-context
  - id: scope
    description: "Step 7b: counts code paths against the 15-path budget."
    kind: group
    workflow: olko-impl-scope
  - id: review-phase
    description: "Step 7c: olko-review on the local Task diff; blocking findings are fixed and re-reviewed."
    kind: group
    workflow: olko-impl-review
  - id: deliver
    description: "Steps 8-9: commit and draft PR only after your yes, PR check, Obsidian and editor gates, merge that keeps the worktree; then closure: acceptance E2E (11), post-merge runtime (12), Feature audit and plan-file question (12a, 12b), then cleanup (13) after the run leaves the worktree."
    kind: group
    workflow: olko-impl-deliver
  - id: report
    description: "The implementation orchestrator writes its final report (delegation plan, scopes, changed files, verification results, unresolved blockers) into the journal."
    kind: llm
    role: orchestrator
    agent: olko-implementation-orchestrator
    tools: [read, edit]
    dirs: ["{{state.task.task.featureDir}}"]
    parse: text
    prompt: |
      Write your final report for Task {{state.task.task.taskName}} of Feature {{state.task.task.featureId}} into the implementation journal of {{state.task.task.taskFile}} and update its Session fields. Delegate nothing, ask nothing and change no code.
      Report the delegation plan, each agent's scope, changed files, verification results and unresolved blockers, from the journal and these facts:
      Worktree: {{state.worktree.worktree.path}} on {{state.worktree.worktree.branch}}
      Chunks: {{state.chunk-next.total}}
      Code paths: {{state.scope-gate.scope-gate.count}}
      Blocking review findings left: {{state.review-gate.review-gate.blocking.length}}
      Project store: {{#state.store-context.store-context.blocked.length}}overlapping ADR topics were decided for this Task only ({{state.ask-store.answer}}): {{#state.store-context.store-context.blocked}}{{topic}} ({{#adrs}}{{.}} {{/adrs}}); {{/state.store-context.store-context.blocked}}report that the store needs the factory workflow olko-adr-store-reconcile for this project.{{/state.store-context.store-context.blocked.length}}{{^state.store-context.store-context.blocked.length}}no overlapping ADR topics.{{/state.store-context.store-context.blocked.length}}
      Delivery: {{#state.commit.commit}}committed {{commit}}, PR {{url}}{{/state.commit.commit}}{{^state.commit.commit}}{{#state.ask-commit.answer}}not committed (you answered {{state.ask-commit.answer}}){{/state.ask-commit.answer}}{{/state.commit.commit}}
      Merge: {{#state.merge-retain.merge-retain}}{{state.merge-retain.merge-retain}}{{/state.merge-retain.merge-retain}}{{^state.merge-retain.merge-retain}}not merged{{/state.merge-retain.merge-retain}}
      Reply with the report as plain text, at most fifteen lines.
edges:
  - { from: entry, to: workspace }
  - { from: workspace, to: preflight-phase }
  - { from: preflight-phase, to: tests-first }
  - { from: tests-first, to: build }
  - { from: build, to: verify }
  - { from: verify, to: context }
  - { from: context, to: scope }
  - { from: scope, to: review-phase }
  - { from: review-phase, to: deliver }
  - { from: deliver, to: report }
  - { from: report, to: END }
