name: olko-plan-review-files
version: 0.2.0
description: "Step 6a: every plan file (the Feature technical plan and each Task plan) goes through the olko-review PLAN route; the confirmed findings of each file are folded in and the consistency gate runs again after every fold."
source: "agents/opencode/olko-plan-documentation-orchestrator.md (Step 6a: olko-review PLAN route once per plan file, confirmed findings folded, consistency gate)"
roles:
  plan-gate: medium
  planner: high
entry: plan-files
limits:
  maxCycleIterations: 4
nodes:
  - id: plan-files
    description: "The plan documentation orchestrator lists the Feature technical plan and every Task plan file, each with its acceptance criteria."
    kind: llm
    role: plan-gate
    agent: olko-plan-documentation-orchestrator
    tools: [read]
    parse: { json: [files] }
    prompt: |
      Do only the listing part of step 6a of your workflow for the plan folder {{state.feature.feature.featureDir}} (project {{input.project}}): list the Feature implementation.md once and every existing Task file tasks/<task-id>-implementation.md once, each with its acceptance criteria (the Feature criteria for implementation.md, the Task criteria for a Task file). Read only; change no file, delegate nothing and ask nothing.
      Feature and Tasks:
      {{state.feature.feature.feature}}
      {{state.feature.feature.tasks}}
      End with one ```json block: {"files": [{"path": "{{state.feature.feature.featureDir}}/<file>", "criteria": "<its acceptance criteria, semicolon separated>"}]}
  - id: plan-next
    description: "Takes the next plan file to review."
    kind: script
    op: list.next
    maxVisits: 50
    with: { over: plan-files.plan-files.files }
  - id: plan-review
    description: "Calls olko-review in PLAN mode for this one file, with the acceptance criteria."
    kind: call
    workflow: olko-review
    maxVisits: 50
    input: { plan: "{{state.plan-next.item.path}}", criteria: "{{state.plan-next.item.criteria}}" }
  - id: after-review
    description: "Branches on the confirmed findings of the reviewed file."
    kind: script
    op: builtin.pass
    maxVisits: 50
  - id: fold-review
    description: "Plan editor folds every confirmed review finding of the file into the plan files and records the review result in tracker.md."
    kind: llm
    role: planner
    skill: olko-plan-editor
    tools: [read, edit]
    maxVisits: 50
    parse: text.raw
    prompt: |
      Fold every confirmed plan review finding below into the plan files it names (project {{input.project}}, folder {{state.feature.feature.featureDir}}), and record the review result of {{state.plan-next.item.path}} in tracker.md. Add every confirmed project violation, every `ask` verdict and every vague criterion to the step 7 question batch in tracker.md; resolve none of them yourself. Edit only that folder.
      {{#state.plan-review.plan-report.plan-report.kept}}
      - {{line}}
      {{/state.plan-review.plan-report.plan-report.kept}}
  - id: gate-review
    description: "Consistency gate after the review fixes of the file."
    kind: call
    workflow: olko-plan-gate
    maxVisits: 50
    input: { featureDir: "{{state.feature.feature.featureDir}}" }
edges:
  - { from: plan-files, to: plan-next }
  - { from: plan-next, to: plan-review, when: "plan-next.done == false", description: "a plan file is left to review" }
  - { from: plan-next, to: END, when: "plan-next.done == true", description: "every plan file reviewed" }
  - { from: plan-review, to: after-review }
  - { from: after-review, to: fold-review, when: "plan-review.plan-report.plan-report.kept != 0", description: "the review confirmed findings in this file" }
  - { from: after-review, to: plan-next, when: "plan-review.plan-report.plan-report.kept == 0", description: "no confirmed finding in this file" }
  - { from: fold-review, to: gate-review }
  - { from: gate-review, to: plan-next }
