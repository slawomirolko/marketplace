name: olko-impl-docker
version: 0.2.0
description: "Steps 6-7: the Docker rebuild runs only in an isolated Compose project of the worktree, with proof that the main project stayed untouched; runtime evidence is collected there and recorded in the journal and the Feature tracker. No errors without positive execution evidence is NOT VERIFIED."
source: "agents/opencode/olko-implementation-orchestrator.md (steps 6-7) and skills/*/olko-worktree-compose-isolation"
roles:
  publisher: medium
  implementer: medium
  orchestrator: medium
entry: docker-rebuild
nodes:
  - id: docker-rebuild
    description: "Git delivery manager rebuilds and restarts the affected services in an isolated Compose project and proves the main project was not touched."
    kind: llm
    role: publisher
    agent: olko-git-delivery-manager
    tools: [read, bash]
    parse: { line: [check, verdict, detail] }
    prompt: |
      Only delivery check 2 (Docker rebuild and restart) for the worktree {{state.worktree.worktree.path}}, Task {{state.task.task.taskName}}, Feature {{state.task.task.featureId}}, plan {{state.task.task.taskFile}}. Follow olko-worktree-compose-isolation: an isolated Compose project only, never the main project. Do not commit, push or open a PR.
      End with one line, the verdict in lowercase: `docker | <pass|fail|blocked> | <isolated project name, services, and the proof the main project stayed untouched>`
  - id: runtime
    description: "The stack implementers collect positive runtime evidence (logs, traces, database) from the isolated project, read only."
    kind: llm
    role: implementer
    agentsFrom: state.stacks.stacks.implementers
    tools: [read, bash]
    parse: { line: [check, verdict, detail] }
    prompt: |
      Read only: collect runtime evidence for Task {{state.task.task.taskName}} from the isolated Compose project of this worktree that the Docker step just started ({{state.docker-rebuild.docker-rebuild.detail}}), never from the main stack. Use the verification contract of {{state.task.task.taskFile}} and {{state.task.task.featurePlan}}: expected log or trace signature, scan window, errors, warnings, exceptions and timeouts. No errors without positive execution evidence is NOT VERIFIED.
      End with one line, the verdict in lowercase: `runtime | <verified|not-verified> | <environment, time, signature found, errors>`
  - id: docker-check
    description: "The implementation orchestrator records the Docker and runtime evidence in the journal and the Feature tracker and decides VERIFIED or NOT VERIFIED."
    kind: llm
    role: orchestrator
    agent: olko-implementation-orchestrator
    tools: [read, edit]
    dirs: ["{{state.task.task.featureDir}}"]
    parse: { line: [check, verdict, detail] }
    prompt: |
      Steps 6 and 7 for Task {{state.task.task.taskName}}: record this evidence in the implementation journal of {{state.task.task.taskFile}} and, with environment, time, expected signature, scan window and errors, in the shared Feature tracker {{state.task.task.tracker}}. Delegate nothing, ask nothing and change no code.
      Docker: {{state.docker-rebuild.docker-rebuild.verdict}} | {{state.docker-rebuild.docker-rebuild.detail}}
      {{#each.state.runtime}}
      runtime {{key}}: {{value.verdict}} | {{value.detail}}
      {{/each.state.runtime}}
      VERIFIED only when the Docker step passed in the isolated project and every stack has positive runtime evidence; no errors without positive execution evidence is NOT VERIFIED.
      End with one line, the verdict in lowercase: `runtime | <verified|not-verified> | <summary>`
  - id: teardown
    description: "Tears down only the isolated Compose project."
    kind: llm
    role: publisher
    agent: olko-git-delivery-manager
    tools: [read, bash]
    parse: text
    prompt: |
      Tear down only the isolated Compose project of the worktree {{state.worktree.worktree.path}} that you started for Task {{state.task.task.taskName}} ({{state.docker-rebuild.docker-rebuild.detail}}). Never touch the main project. Report the command and result.
  - id: stop-runtime
    description: "Stops: runtime is not verified."
    kind: script
    op: builtin.stop
    with: { reason: "Implementation stopped: runtime verification failed: {{state.docker-check.docker-check.detail}}" }
edges:
  - { from: docker-rebuild, to: runtime }
  - { from: runtime, to: docker-check }
  - { from: docker-check, to: teardown }
  - { from: teardown, to: END, when: 'docker-check.docker-check.verdict == "verified"', description: "runtime VERIFIED" }
  - { from: teardown, to: stop-runtime, description: "runtime NOT VERIFIED" }
