name: olko-impl-verify
version: 0.3.0
description: "Steps 4-7: style and affected tests until they pass, then the acceptance E2E recheck (step 5a), then the Docker rebuild in an isolated Compose project with runtime evidence (behind switches.docker)."
source: "agents/opencode/olko-implementation-orchestrator.md and skills/workflow/olko-task-implementation-workflow/SKILL.md (workflow.md gates 6-7: style, affected tests, E2E implementation recheck, isolated rebuild and runtime evidence; WORKTREE COMPOSE ISOLATION)"
entry: checks
roles:
  runner: medium
nodes:
  - id: checks
    description: "Calls the shared checks step: style, affected tests and fix rounds."
    kind: call
    workflow: olko-impl-checks
    input: { plan: "{{state.task.task.taskFile}}", featureDir: "{{state.task.task.featureDir}}", base: "{{state.worktree.worktree.base}}" }
  - id: e2e-recheck
    description: "Step 5a: the acceptance E2E runner runs the implementation phase of the same manifest; every criterion must pass and is compared with the baseline report. Never skipped for missing tools, credentials, screenshots or cleanup."
    kind: llm
    role: runner
    agent: olko-e2e-acceptance-runner
    tools: [read, bash]
    dirs: ["{{state.task.task.featureDir}}"]
    parse: { line: [phase, verdict, detail] }
    prompt: |
      Phase implementation for Task {{state.task.task.taskName}}, from the same manifest as the baseline: the Task manifest <e2eManifestDir>/<Task ID>.acceptance.json (e2eManifestDir from the project adapter, default {{state.task.task.featureDir}}/e2e); manifests live under plans/, never under tests/e2e. Pass every exact current Task acceptance criterion ID, read from the tracker; a missing or extra mapping blocks. Run only in the isolated worktree project of {{state.worktree.worktree.path}}, never the main stack or the shared database. Do not change any file.
      Report PASS, FAIL or NOT VERIFIED per criterion, compare each with the baseline result, and give the cleanup proof and the first actionable failure.
      End with one line, the verdict in lowercase: `implementation | <pass|fail|not verified> | <first failing criterion or blocker, cleanup proof>`
  - id: stop-e2e-recheck
    description: "Stops before Docker: a criterion did not pass in the acceptance E2E recheck."
    kind: script
    op: builtin.stop
    with: { reason: "Implementation stopped: acceptance E2E recheck {{state.e2e-recheck.e2e-recheck.verdict}}: {{state.e2e-recheck.e2e-recheck.detail}}" }
  - id: docker
    description: "Rebuilds in an isolated Compose project, collects runtime evidence and tears it down; skipped when switches.docker is off."
    kind: subgraph
    workflow: olko-impl-docker
    enabledWhen: "switches.docker == true"
edges:
  - { from: checks, to: e2e-recheck }
  - { from: e2e-recheck, to: stop-e2e-recheck, when: 'e2e-recheck.e2e-recheck.verdict != "pass"', description: "a criterion is FAIL or NOT VERIFIED: the run stops" }
  - { from: e2e-recheck, to: docker, description: "every criterion passed: Docker rebuild follows" }
  - { from: docker, to: END }
