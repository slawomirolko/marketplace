name: olko-review
version: 0.5.0
description: "Code review of a PR, a local diff or a plan: REVIEW for someone else's PR (or a fresh review of your own), LOCAL for a working tree against a base branch, PLAN for a plan file, FEEDBACK for comments and CI on your own PR."
inputs: "repo, owner/name, and pr, the PR number, plus fresh: true for a fresh review of your own PR; or plan, a plan file path in the workspace, and optional criteria."
source: agents/opencode/olko-review-orchestrator.md (REVIEW, PLAN and FEEDBACK routes)
roles:
  orchestrator: medium
  lens: medium
  verifier: medium
  rules: medium
  feedback: medium
entry: route
limits:
  maxCycleIterations: 3
nodes:
  - id: route
    description: "The review orchestrator picks the route: input plan -> PLAN; input base -> LOCAL; your own PR without fresh -> FEEDBACK; otherwise REVIEW."
    kind: llm
    role: orchestrator
    agent: olko-review-orchestrator
    tools: [read, bash]
    parse: { line: [route, reason] }
    prompt: |
      Do only the ROUTE step of your workflow. Run no lens, change nothing and post nothing: the factory runs the other steps.
      {{#input.plan}}
      Input: the plan file {{input.plan}}. The route is PLAN.
      {{/input.plan}}
      {{^input.plan}}
      {{#input.base}}
      Input: a caller's local diff against {{input.base}}. The route is LOCAL: nothing is posted.
      {{/input.base}}
      {{^input.base}}
      Input: PR #{{input.pr}} in {{input.repo}}{{#input.fresh}}, and the user asks for a fresh review{{/input.fresh}}.
      Compare the PR author (`gh pr view {{input.pr}} --repo {{input.repo}} --json author`) with the signed-in user (`gh api user --jq .login`). Same user without a fresh review: FEEDBACK. Otherwise: REVIEW.
      {{/input.base}}
      {{/input.plan}}
      End with one line: `<REVIEW|LOCAL|PLAN|FEEDBACK> | <reason>`
  - id: review
    description: "REVIEW and LOCAL routes: a read-only review of someone else's PR, a fresh review of your own, or a local working tree; PR findings are posted, local findings go back to the caller."
    kind: group
    workflow: olko-review-review
  - id: plan
    description: "PLAN route: reviews a plan file against its acceptance criteria and the project rules before implementation; no memory."
    kind: group
    workflow: olko-review-plan
  - id: feedback
    description: "FEEDBACK route: works through CI state and review comments on your own PR, decides each item with the user and drafts replies."
    kind: group
    workflow: olko-review-feedback
edges:
  - { from: route, to: plan, when: 'route.route.route == "PLAN"', description: "input plan is set" }
  - { from: route, to: feedback, when: 'route.route.route == "FEEDBACK"', description: "your own PR without fresh" }
  - { from: route, to: review, description: "REVIEW (someone else's PR, or fresh: true) or LOCAL (input base is set: a local working tree, nothing posted)" }
  - { from: plan, to: END }
  - { from: feedback, to: END }
  - { from: review, to: END }
