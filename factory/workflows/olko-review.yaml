name: olko-review
version: 0.4.0
description: "Code review of a PR or a plan: REVIEW for someone else's PR (or a fresh review of your own), PLAN for a plan file, FEEDBACK for comments and CI on your own PR."
source: agents/opencode/olko-review-orchestrator.md (REVIEW, PLAN and FEEDBACK routes)
roles:
  lens: medium
  verifier: medium
  rules: medium
  feedback: medium
entry: route
limits:
  maxCycleIterations: 3
nodes:
  - id: route
    description: "Picks the route: input plan -> PLAN; your own PR without fresh -> FEEDBACK; otherwise REVIEW."
    kind: script
    op: review.route
  - id: review
    description: "REVIEW route: a read-only review of someone else's PR or a fresh review of your own, from scope to posted comments."
    kind: group
    workflow: olko-review-review
  - id: plan
    description: "PLAN route: reviews a plan file against its acceptance criteria and the project rules before implementation; no memory."
    kind: group
    workflow: olko-review-plan
  - id: feedback
    description: "FEEDBACK route: works through CI state and review comments on your own PR, decides each item with the user and drafts replies."
    kind: group
    workflow: olko-review-feedback
edges:
  - { from: route, to: review, when: 'route.route == "REVIEW"', description: "someone else's PR, or fresh: true" }
  - { from: route, to: plan, when: 'route.route == "PLAN"', description: "input plan is set" }
  - { from: route, to: feedback, when: 'route.route == "FEEDBACK"', description: "your own PR without fresh" }
  - { from: plan, to: END }
  - { from: feedback, to: END }
  - { from: review, to: END }
