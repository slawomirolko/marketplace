name: olko-review
version: 0.4.0
source: agents/opencode/olko-review-orchestrator.md (REVIEW, PLAN and FEEDBACK routes)
roles:
  lens: medium
  verifier: medium
  rules: medium
  feedback: medium
entry: route
limits:
  maxCycleIterations: 3
nodes:
  - id: route
    kind: script
    op: review.route
  - id: scope
    kind: script
    op: github.prScope
    with:
      exclude:
        - '(^|/)pnpm-lock\.yaml$'
        - '(^|/)package-lock\.json$'
        - '(^|/)yarn\.lock$'
  - id: detect
    kind: script
    op: review.detectLenses
    with:
      always: { id: bugs, agent: olko-review-bugs-lens }
      requirements: { id: requirements, agent: olko-review-requirements-lens }
      stacks:
        - { id: dotnet, agent: olko-review-dotnet-lens, extensions: [".cs", ".csproj", ".props", ".targets"] }
        - { id: react, agent: olko-review-react-lens, extensions: [".ts", ".tsx"] }
        - { id: mobile, agent: olko-review-mobile-lens, extensions: [".kt", ".kts"] }
        - { id: python, agent: olko-review-python-lens, extensions: [".py"] }
  - id: memory
    kind: script
    op: memory.load
    with: { agent: olko-review-orchestrator }
  - id: ask-memory
    kind: interrupt
    question:
      id: q-memory-missing
      text: "The review memory block {{state.memory.file}} does not exist. Fix: install the agent memory with `node scripts/install-opencode-agents.mjs --project <project> --agent olko-review-orchestrator`. Continue this review without memory, or stop?"
      allowed: [continue, stop]
  - id: lenses
    kind: llm
    role: lens
    agentsFrom: state.detect.lenses
    parse: review.findings
    prompt: |
      PR #{{state.scope.pr}}: {{state.scope.title}}
      {{#agent.criteria}}

      Mode: {{agent.mode}}
      Acceptance criteria (from the PR description):
      {{agent.criteria}}
      {{/agent.criteria}}

      PR description:
      {{state.scope.body}}

      Files for this lens ({{agent.files.length}}):
      {{#agent.files}}
      - {{path}}
      {{/agent.files}}

      Suppress: {{state.memory.suppressText}}. Prioritize: {{state.memory.prioritizeText}}.
      {{#state.scope.stale}}
      The current branch is not the PR head: the working-tree files are stale. Judge changed lines from the hunks only.
      {{/state.scope.stale}}
      {{^state.scope.stale}}
      The current branch is the PR head. The files in the working tree match the diff.
      {{/state.scope.stale}}

      Diff hunks:
      {{#agent.files}}
      {{diff}}
      {{/agent.files}}
  - id: merge
    kind: script
    op: review.mergeFindings
  - id: verify
    kind: llm
    role: verifier
    agent: olko-review-verifier
    parse: review.verdicts
    prompt: |
      PR #{{state.scope.pr}}: {{state.scope.title}}
      {{#state.scope.stale}}
      The current branch is not the PR head: the working-tree files are stale. Judge changed lines from the hunks only.
      {{/state.scope.stale}}

      Findings ({{state.merge.findings.length}}), one per line:
      {{#state.merge.findings}}
      {{line}}
      {{/state.merge.findings}}
  - id: confirm
    kind: script
    op: review.confirmFindings
  - id: rules-check
    kind: llm
    role: rules
    agent: olko-project-rules-check
    parse: review.rulesCheck
    prompt: |
      Mode: code
      PR #{{state.scope.pr}}: {{state.scope.title}}

      Changed paths:
      {{#state.scope.files}}
      - {{path}}
      {{/state.scope.files}}

      Confirmed findings ({{state.confirm.confirmed.length}}), one per line:
      {{#state.confirm.confirmed}}
      {{line}}
      {{/state.confirm.confirmed}}

      Diff hunks:
      {{#state.scope.files}}
      {{diff}}
      {{/state.scope.files}}
  - id: rules-merge
    kind: script
    op: review.mergeRules
  - id: verify-violations
    kind: llm
    role: verifier
    agent: olko-review-verifier
    parse: review.verdicts
    prompt: |
      PR #{{state.scope.pr}}: {{state.scope.title}}

      Findings ({{state.rules-merge.violations.length}}), one per line:
      {{#state.rules-merge.violations}}
      {{.}}
      {{/state.rules-merge.violations}}
  - id: rules-violations
    kind: script
    op: review.addViolations
  - id: next-decision
    kind: script
    op: list.next
    maxVisits: 100
    with: { over: rules-violations.decide }
  - id: next-decision-ask
    kind: script
    op: list.next
    maxVisits: 100
    with: { over: rules-merge.decide }
  - id: ask-rule
    kind: interrupt
    maxVisits: 100
    question:
      id: "q-rule-{{state.next-decision.index}}{{state.next-decision-ask.index}}"
      text: "The project store and a finding disagree. Which holds?\n{{state.next-decision.item.line}}{{state.next-decision-ask.item.line}}\nStore entry: {{state.next-decision.item.cite}}{{state.next-decision-ask.item.cite}}"
      allowed: [finding, store]
  - id: rank
    kind: script
    op: review.rankFindings
  - id: next-finding
    kind: script
    op: list.next
    maxVisits: 200
    with: { over: rank.kept }
  - id: ask-post
    kind: interrupt
    maxVisits: 200
    question:
      id: "q-post-{{state.next-finding.index}}"
      text: "Finding {{state.next-finding.number}} of {{state.next-finding.total}} on PR #{{state.scope.pr}}. Post it as a PR comment?\n{{state.next-finding.item.line}}"
      allowed: [post, skip]
  - id: post-one
    kind: script
    op: github.postComment
    maxVisits: 200
    with: { from: next-finding }
  - id: memory-save
    kind: script
    op: memory.persist
    with: { questionPrefix: q-post- }
  - id: plan-read
    kind: script
    op: plan.read
  - id: plan-lens
    kind: llm
    role: lens
    agents:
      - { id: requirements, agent: olko-review-requirements-lens }
    parse: review.findings
    prompt: |
      Mode: plan
      Acceptance criteria: {{state.plan-read.criteria}}

      Plan file: {{state.plan-read.path}}

      Plan text:
      {{state.plan-read.text}}
  - id: plan-merge
    kind: script
    op: review.mergeFindings
    with: { from: plan-lens }
  - id: plan-verify
    kind: llm
    role: verifier
    agent: olko-review-verifier
    parse: review.verdicts
    prompt: |
      Plan review of {{state.plan-read.path}}. The findings quote plan steps; check them against the plan text below.

      Findings ({{state.plan-merge.findings.length}}), one per line:
      {{#state.plan-merge.findings}}
      {{line}}
      {{/state.plan-merge.findings}}

      Plan text:
      {{state.plan-read.text}}
  - id: plan-confirm
    kind: script
    op: review.confirmFindings
    with: { findings: plan-merge, verdicts: plan-verify }
  - id: plan-rules
    kind: llm
    role: rules
    agent: olko-project-rules-check
    parse: review.rulesCheck
    prompt: |
      Mode: plan
      Plan file: {{state.plan-read.path}}

      Confirmed findings ({{state.plan-confirm.confirmed.length}}), one per line:
      {{#state.plan-confirm.confirmed}}
      {{line}}
      {{/state.plan-confirm.confirmed}}

      Plan text:
      {{state.plan-read.text}}
  - id: plan-rules-merge
    kind: script
    op: review.mergeRules
    with: { confirmed: plan-confirm, check: plan-rules }
  - id: plan-verify-violations
    kind: llm
    role: verifier
    agent: olko-review-verifier
    parse: review.verdicts
    prompt: |
      Plan review of {{state.plan-read.path}}.

      Findings ({{state.plan-rules-merge.violations.length}}), one per line:
      {{#state.plan-rules-merge.violations}}
      {{.}}
      {{/state.plan-rules-merge.violations}}

      Plan text:
      {{state.plan-read.text}}
  - id: plan-rules-violations
    kind: script
    op: review.addViolations
    with: { rules: plan-rules-merge, verdicts: plan-verify-violations }
  - id: plan-next-decision
    kind: script
    op: list.next
    maxVisits: 100
    with: { over: plan-rules-violations.decide }
  - id: plan-next-decision-ask
    kind: script
    op: list.next
    maxVisits: 100
    with: { over: plan-rules-merge.decide }
  - id: plan-ask-rule
    kind: interrupt
    maxVisits: 100
    question:
      id: "q-plan-rule-{{state.plan-next-decision.index}}{{state.plan-next-decision-ask.index}}"
      text: "Plan approval stops here: the project store and a finding disagree. Which holds?\n{{state.plan-next-decision.item.line}}{{state.plan-next-decision-ask.item.line}}\nStore entry: {{state.plan-next-decision.item.cite}}{{state.plan-next-decision-ask.item.cite}}"
      allowed: [finding, store]
  - id: plan-report
    kind: script
    op: review.planReport
  - id: fb-check
    kind: script
    op: github.prFeedback
  - id: fb-next
    kind: script
    op: list.next
    maxVisits: 200
    with: { over: fb-check.items }
  - id: fb-assess
    kind: llm
    role: feedback
    agent: olko-review-feedback-handler
    maxVisits: 200
    parse: text.raw
    prompt: |
      Do only step 4 of your workflow for this one item, and do not change any file: the factory owns the other steps and asks the user.
      PR #{{input.pr}} in {{input.repo}}, item {{state.fb-next.number}} of {{state.fb-next.total}}{{#state.fb-next.item.path}}, {{state.fb-next.item.path}}:{{state.fb-next.item.line}}{{/state.fb-next.item.path}}.

      Comments:
      {{#state.fb-next.item.comments}}
      - {{author}} ({{url}}): {{body}}
      {{/state.fb-next.item.comments}}

      Restate the request in your own words, verify it against the code, and recommend fix, wont-fix (with technical reasoning) or question.
      Reply with one line: `recommend | <fix|wont-fix|question> | <restatement> | <reasoning>`
  - id: fb-decide
    kind: interrupt
    maxVisits: 200
    question:
      id: "q-feedback-{{state.fb-next.index}}"
      text: "Review comment {{state.fb-next.number}} of {{state.fb-next.total}}{{#state.fb-next.item.path}} on {{state.fb-next.item.path}}:{{state.fb-next.item.line}}{{/state.fb-next.item.path}}.\nAssessment: {{state.fb-assess.fb-assess}}\nYour decision?"
      allowed: [fix, wont-fix, question, skip]
  - id: fb-plan
    kind: script
    op: feedback.plan
  - id: fb-implement
    kind: interrupt
    question:
      id: q-feedback-implement
      text: "{{state.fb-plan.fixes}} items have the decision fix. Implement them now?"
      allowed: ["yes", "no"]
  - id: fb-fix
    kind: script
    op: feedback.fixNotAvailable
  - id: fb-reply-next
    kind: script
    op: list.next
    maxVisits: 200
    with: { over: fb-plan.replies }
  - id: fb-draft
    kind: llm
    role: feedback
    agent: olko-review-feedback-handler
    maxVisits: 200
    parse: text.raw
    prompt: |
      Do only step 7 of your workflow for this one item: draft one reply, and do not post it or change any file.
      Decision: {{state.fb-reply-next.item.decision}}.

      Comments:
      {{#state.fb-reply-next.item.comments}}
      - {{author}} ({{url}}): {{body}}
      {{/state.fb-reply-next.item.comments}}

      Reply with the reply text only.
  - id: fb-reply-ask
    kind: interrupt
    maxVisits: 200
    question:
      id: "q-reply-{{state.fb-reply-next.index}}"
      text: "Post this reply?\n{{state.fb-draft.fb-draft}}"
      allowed: [post, skip]
  - id: fb-post
    kind: script
    op: github.postReply
    maxVisits: 200
  - id: fb-report
    kind: script
    op: feedback.report
edges:
  - { from: route, to: scope, when: 'route.route == "REVIEW"' }
  - { from: route, to: plan-read, when: 'route.route == "PLAN"' }
  - { from: route, to: fb-check, when: 'route.route == "FEEDBACK"' }
  - { from: plan-read, to: plan-lens }
  - { from: plan-lens, to: plan-merge }
  - { from: plan-merge, to: plan-verify, when: "plan-merge.findings > 0" }
  - { from: plan-merge, to: plan-confirm, when: "plan-merge.findings == 0" }
  - { from: plan-verify, to: plan-confirm }
  - { from: plan-confirm, to: plan-rules }
  - { from: plan-rules, to: plan-rules-merge }
  - { from: plan-rules-merge, to: plan-verify-violations, when: "plan-rules-merge.violations > 0" }
  - { from: plan-rules-merge, to: plan-next-decision-ask, when: "plan-rules-merge.violations == 0" }
  - { from: plan-verify-violations, to: plan-rules-violations }
  - { from: plan-rules-violations, to: plan-next-decision }
  - { from: plan-next-decision, to: plan-ask-rule, when: "plan-next-decision.done == false" }
  - { from: plan-next-decision, to: plan-report, when: "plan-next-decision.done == true" }
  - { from: plan-next-decision-ask, to: plan-ask-rule, when: "plan-next-decision-ask.done == false" }
  - { from: plan-next-decision-ask, to: plan-report, when: "plan-next-decision-ask.done == true" }
  - { from: plan-ask-rule, to: plan-next-decision, when: "plan-rules-merge.violations > 0" }
  - { from: plan-ask-rule, to: plan-next-decision-ask, when: "plan-rules-merge.violations == 0" }
  - { from: plan-report, to: END }
  - { from: fb-check, to: fb-next }
  - { from: fb-next, to: fb-assess, when: "fb-next.done == false" }
  - { from: fb-next, to: fb-plan, when: "fb-next.done == true" }
  - { from: fb-assess, to: fb-decide }
  - { from: fb-decide, to: fb-next }
  - { from: fb-plan, to: fb-implement, when: "fb-plan.fixes > 0" }
  - { from: fb-plan, to: fb-reply-next, when: "fb-plan.fixes == 0" }
  - { from: fb-implement, to: fb-fix, when: 'fb-implement.answer == "yes"' }
  - { from: fb-implement, to: fb-reply-next, when: 'fb-implement.answer == "no"' }
  - { from: fb-fix, to: END }
  - { from: fb-reply-next, to: fb-draft, when: "fb-reply-next.done == false" }
  - { from: fb-reply-next, to: fb-report, when: "fb-reply-next.done == true" }
  - { from: fb-draft, to: fb-reply-ask }
  - { from: fb-reply-ask, to: fb-post, when: 'fb-reply-ask.answer == "post"' }
  - { from: fb-reply-ask, to: fb-reply-next, when: 'fb-reply-ask.answer == "skip"' }
  - { from: fb-post, to: fb-reply-next }
  - { from: fb-report, to: END }
  - { from: scope, to: detect }
  - { from: detect, to: memory }
  - { from: memory, to: lenses, when: "memory.loaded == true" }
  - { from: memory, to: ask-memory, when: "memory.loaded == false" }
  - { from: ask-memory, to: lenses, when: 'ask-memory.answer == "continue"' }
  - { from: ask-memory, to: END, when: 'ask-memory.answer == "stop"' }
  - { from: lenses, to: merge }
  - { from: merge, to: verify, when: "merge.findings > 0" }
  - { from: merge, to: confirm, when: "merge.findings == 0" }
  - { from: verify, to: confirm }
  - { from: confirm, to: rules-check }
  - { from: rules-check, to: rules-merge }
  - { from: rules-merge, to: verify-violations, when: "rules-merge.violations > 0" }
  - { from: rules-merge, to: next-decision-ask, when: "rules-merge.violations == 0" }
  - { from: verify-violations, to: rules-violations }
  - { from: rules-violations, to: next-decision }
  - { from: next-decision, to: ask-rule, when: "next-decision.done == false" }
  - { from: next-decision, to: rank, when: "next-decision.done == true" }
  - { from: next-decision-ask, to: ask-rule, when: "next-decision-ask.done == false" }
  - { from: next-decision-ask, to: rank, when: "next-decision-ask.done == true" }
  - { from: ask-rule, to: next-decision, when: "rules-merge.violations > 0" }
  - { from: ask-rule, to: next-decision-ask, when: "rules-merge.violations == 0" }
  - { from: rank, to: next-finding }
  - { from: next-finding, to: ask-post, when: "next-finding.done == false" }
  - { from: next-finding, to: memory-save, when: "next-finding.done == true" }
  - { from: ask-post, to: post-one, when: 'ask-post.answer == "post"' }
  - { from: ask-post, to: next-finding, when: 'ask-post.answer == "skip"' }
  - { from: post-one, to: next-finding }
  - { from: memory-save, to: END }
