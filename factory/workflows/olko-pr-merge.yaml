name: olko-pr-merge
version: 0.2.0
description: "Shared step after a PR was opened, called with input path, prUrl and prBranch: asks leave, wait for CI or merge; olko-commit waits for the checks, or marks a draft ready, squash merges, updates local main and checks the commit is on origin/main. The caller reads ask-pr.answer to know whether it merged."
source: "agents/opencode/olko-marketplace-skill-sync-manager.md (phase 5) and plugins/olko-sync/agents/olko-claude-sync-manager.md (phase 5), run through skills/git/olko-commit (post-PR decision and post-merge cleanup)"
roles:
  publisher: medium
entry: ask-pr
limits:
  maxCycleIterations: 3
nodes:
  - id: ask-pr
    description: "Asks: leave the PR open, wait for CI, or squash merge (a draft is marked ready first)."
    kind: interrupt
    maxVisits: 20
    question:
      id: "q-pr-merge-{{state.wait-round.count}}"
      text: "PR: {{input.prUrl}}{{#state.wait-ci}}\nCI checks passed: {{state.wait-ci.wait-ci.passed}}{{/state.wait-ci}}\nLeave it open, wait for CI, or squash merge? Anything that needs the merge (installing) runs only after merge."
      allowed: [leave, wait, merge]
  - id: wait-round
    description: "Counts the CI waits, so each later question is new."
    kind: script
    op: builtin.count
    maxVisits: 20
  - id: wait-ci
    description: "olko-commit waits for the PR checks and reports whether they passed. It does not merge."
    kind: llm
    role: publisher
    skill: olko-commit
    tools: [read, bash]
    dirs: ["{{input.path}}"]
    maxVisits: 20
    parse: { json: [passed, detail] }
    prompt: |
      Do only the CI wait of the post-PR decision of olko-commit for the {{input.label}} PR {{input.prUrl}} (repository {{input.path}}): watch its checks until they finish (`gh pr checks <url> --watch --fail-fast`). Do not merge, switch branches, commit or delete anything, and do not ask: the user decides after this step.

      End with one ```json block:
      {"passed": <true when every check passed, else false>, "detail": "<the last lines of the check output, or the failing check names>"}
  - id: merge
    description: "olko-commit marks a draft ready, squash merges with branch deletion, updates local main and verifies the merge commit on origin/main."
    kind: llm
    role: publisher
    skill: olko-commit
    tools: [read, bash]
    dirs: ["{{input.path}}"]
    parse: { json: [merged, commit, detail] }
    prompt: |
      The user explicitly approved the squash merge of the {{input.label}} PR {{input.prUrl}} (branch {{input.prBranch}}, repository {{input.path}}; use `gh` with that URL and `git -C` on that path). Do only the squash merge and the post-merge cleanup of olko-commit, without asking:
      1. If the PR is a draft, mark it ready (`gh pr ready`).
      2. `gh pr merge <url> --squash --delete-branch`.
      3. Read the merge commit (`gh pr view <url> --json mergeCommit`).
      4. Switch the repository to main, pull origin/main fast-forward only, and delete the local branch {{input.prBranch}}.
      5. Verify the merge commit is on origin/main (`git merge-base --is-ancestor <commit> origin/main`).
      Stop at the first failing step.

      End with one ```json block:
      {"merged": <true only when every step passed and the commit is on origin/main>, "commit": "<merge commit sha, or null>", "detail": "<what was done, or which step failed and its error>"}
  - id: stop-merge
    description: "Stops the run: the squash merge or its verification failed."
    kind: script
    op: builtin.stop
    with: { reason: "Squash merge failed or the merge commit is not on origin/main; the merge step names the failing step." }
edges:
  - { from: ask-pr, to: merge, when: 'ask-pr.answer == "merge"', description: "you chose merge" }
  - { from: ask-pr, to: wait-round, when: 'ask-pr.answer == "wait"', description: "you chose wait" }
  - { from: ask-pr, to: END, when: 'ask-pr.answer == "leave"', description: "you chose leave" }
  - { from: wait-round, to: wait-ci }
  - { from: wait-ci, to: ask-pr }
  - { from: merge, to: stop-merge, when: "merge.merge.merged != true", description: "the merge or its verification failed" }
  - { from: merge, to: END, description: "merged and verified on origin/main" }
  - { from: stop-merge, to: END, description: "never reached: stop-merge fails the run" }
