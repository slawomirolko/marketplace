name: olko-safe-source
version: 0.1.0
description: "Shared step, called with input path and label: requires a clean checkout on main, fast-forwarded to origin/main; asks before switching branch and stops the run otherwise. Never compares against a stale checkout."
source: "agents/opencode/olko-marketplace-skill-sync-manager.md (phase 1) and plugins/olko-sync/agents/olko-claude-sync-manager.md (phase 1)"
entry: safe-source
limits:
  maxCycleIterations: 3
nodes:
  - id: safe-source
    description: "Checks the checkout in input.path: clean worktree, branch main, fetch and fast-forward pull."
    kind: script
    op: sync.safeSource
    maxVisits: 2
    with: { question: q-safe-source-main }
  - id: ask-main
    description: "Asks whether to switch the checkout to main."
    kind: interrupt
    question:
      id: q-safe-source-main
      text: "The {{input.label}} checkout is on {{state.safe-source.detail}}, not main. Switch it to main?"
      allowed: [switch, stop]
  - id: stop-unsafe
    description: "Stops the run: the checkout is not safe to compare against."
    kind: script
    op: sync.stopUnsafe
edges:
  - { from: safe-source, to: END, when: "safe-source.ok == true", description: "clean and current" }
  - { from: safe-source, to: ask-main, when: 'safe-source.reason == "not-main"', description: "not on main" }
  - { from: safe-source, to: stop-unsafe, description: "dirty, no remote or pull failed" }
  - { from: ask-main, to: safe-source, when: 'ask-main.answer == "switch"', description: "you chose switch" }
  - { from: ask-main, to: stop-unsafe, when: 'ask-main.answer == "stop"', description: "you chose stop" }
  - { from: stop-unsafe, to: END, description: "never reached: stop-unsafe fails the run" }
