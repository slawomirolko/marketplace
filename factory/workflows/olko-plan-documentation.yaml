name: olko-plan-documentation
version: 0.4.0
description: "Plans work from an idea or an accepted Feature: discovery drafts the Epic/Feature/Task hierarchy, planning writes the business plan, the technical plan and one implementation plan per Task, then reviews, grills and finalizes them. Every question to the user is composed by grill-with-docs; the workflow only puts it to the user."
source: agents/opencode/olko-plan-documentation-orchestrator.md (DISCOVERY and IMPLEMENTATION PLANNING; each phase is a group file, tracker steps sit behind switches.tracker)
entry: route
roles:
  planner: high
limits:
  maxCycleIterations: 4
nodes:
  - id: route
    description: "Picks the path by the requested deliverable (TWO DISTINCT PATHS): input.route names it; without a known route the edges ask one routing question."
    kind: script
    op: builtin.pass
  - id: route-grill
    description: "grill-with-docs composes the one routing question (discovery, planning or both) in the user's response language; it changes no file and asks nothing itself."
    kind: llm
    role: planner
    skill: grill-with-docs
    tools: [read]
    dirs: ["{{input.project}}"]
    parse: text.raw
    prompt: |
      Compose the one routing question for the project {{input.project}}: what the user wants: discovery (create or refine Epic/Feature/Task issues), planning (implementation plans for an accepted Feature), or both. Offer exactly these three choices. Return the question text only; the workflow puts it to the user. Read only.
      Language: read userResponseLanguage from .agents/skill-config.md in {{input.project}} (unset: the language of the user's latest message). An explicit language request from the user in this conversation overrides it. Write the question in that language, concisely.
      If the skill cannot be loaded, reply only with `blocker | grill-with-docs cannot be loaded`.
  - id: route-blocked
    description: "Stops the run when grill-with-docs cannot be loaded: the tooling blocker is reported and nothing is asked of the user."
    kind: script
    op: builtin.stop
    with: { reason: "grill-with-docs cannot be loaded: the run stopped without asking the user." }
  - id: ask-route
    description: "Puts the routing question composed by grill-with-docs to the user."
    kind: interrupt
    question:
      id: q-plan-route
      text: "{{state.route-grill.route-grill}}"
      allowed: [discovery, planning, both]
  - id: discovery
    description: "Drafts and reviews the Epic/Feature/Task hierarchy with the backlog writer."
    kind: group
    workflow: olko-plan-discovery
  - id: discovery-report
    description: "Ends a discovery-only run after the draft was approved (and published when the tracker is on)."
    kind: script
    op: builtin.pass
  - id: entry
    description: "Entry gate of planning: the Feature and every Task must have acceptance criteria."
    kind: group
    workflow: olko-plan-entry
  - id: package
    description: "Builds the first plan package: evidence, business plan, technical plans, consistency gate."
    kind: group
    workflow: olko-plan-package
  - id: audit-phase
    description: "Checks the plan with the stack auditors of the technologies it touches."
    kind: group
    workflow: olko-plan-audit
  - id: review-phase
    description: "Reviews every plan file with the olko-review PLAN route."
    kind: group
    workflow: olko-plan-review-files
  - id: grill-phase
    description: "Asks the user grill questions in batches and re-validates the plan after each batch."
    kind: group
    workflow: olko-plan-grill
  - id: readiness-phase
    description: "Cleans the plan up and resolves blockers until every plan is ready for implementation."
    kind: group
    workflow: olko-plan-readiness
  - id: finalize
    description: "Records Domain changes, memory and opens the plan; checks nothing outside the plan folder changed."
    kind: group
    workflow: olko-plan-finalize
edges:
  - { from: route, to: entry, when: 'input.route == "planning"', description: "planning only: skip discovery" }
  - { from: route, to: discovery, when: 'input.route == "discovery" || input.route == "both"', description: "discovery or both" }
  - { from: route, to: route-grill, description: "no known route in the run input: grill-with-docs composes the routing question" }
  - { from: route-grill, to: route-blocked, when: 'route-grill.route-grill == "blocker | grill-with-docs cannot be loaded"', description: "grill-with-docs could not be loaded: stop, the blocker is not put to the user as a question" }
  - { from: route-grill, to: ask-route, description: "grill-with-docs composed the routing question: put it to the user" }
  - { from: ask-route, to: entry, when: 'ask-route.answer == "planning"', description: "you chose planning: skip discovery" }
  - { from: ask-route, to: discovery, description: "you chose discovery or both" }
  - { from: discovery, to: discovery-report, when: 'input.route == "discovery" || ask-route.answer == "discovery"', description: "only discovery was requested" }
  - { from: discovery, to: entry, description: "both: plan the approved draft" }
  - { from: discovery-report, to: END }
  - { from: entry, to: package }
  - { from: package, to: audit-phase }
  - { from: audit-phase, to: review-phase }
  - { from: review-phase, to: grill-phase }
  - { from: grill-phase, to: readiness-phase }
  - { from: readiness-phase, to: finalize }
  - { from: finalize, to: END }
