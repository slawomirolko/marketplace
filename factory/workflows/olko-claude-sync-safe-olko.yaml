name: olko-claude-sync-safe-olko
version: 0.1.0
description: "Requires a clean Olko checkout on main, fast-forwarded to origin/main; asks before switching branch and stops otherwise."
source: "plugins/olko-sync/agents/olko-claude-sync-manager.md (phase 1, Olko)"
entry: safe-olko
limits:
  maxCycleIterations: 3
nodes:
  - id: safe-olko
    description: "Checks Olko: clean worktree, branch main, fetch and fast-forward pull."
    kind: script
    op: sync.safeSource
    maxVisits: 2
    with: { path: state.olko, question: q-claude-sync-main-olko }
  - id: ask-main-olko
    description: "Asks whether to switch Olko to main."
    kind: interrupt
    question:
      id: q-claude-sync-main-olko
      text: "The Olko checkout {{state.state.olko}} is on {{state.safe-olko.detail}}, not main. Switch it to main?"
      allowed: [switch, stop]
  - id: stop-olko
    description: "Stops the run: the Olko checkout is not safe."
    kind: script
    op: sync.stopUnsafe
    with: { from: safe-olko }
edges:
  - { from: safe-olko, to: END, when: "safe-olko.ok == true", description: "Olko is clean and current" }
  - { from: safe-olko, to: ask-main-olko, when: 'safe-olko.reason == "not-main"', description: "not on main" }
  - { from: safe-olko, to: stop-olko, description: "dirty, no remote or pull failed" }
  - { from: ask-main-olko, to: safe-olko, when: 'ask-main-olko.answer == "switch"', description: "you chose switch" }
  - { from: ask-main-olko, to: stop-olko, when: 'ask-main-olko.answer == "stop"', description: "you chose stop" }
  - { from: stop-olko, to: FINISH }
