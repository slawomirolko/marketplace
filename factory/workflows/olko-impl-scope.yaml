name: olko-impl-scope
version: 0.2.0
description: "Step 7b: the scope gate counts the code paths of the Task diff (documentation paths are counted separately). More than 15 stops commit, push and PR unless you extend the budget for this Task."
source: "agents/opencode/olko-implementation-orchestrator.md (step 7b, TASK-TO-PR SCOPE GATE) and skills/*/olko-task-scope-gates (PATH BUDGET)"
roles:
  orchestrator: medium
entry: scope-gate
nodes:
  - id: scope-gate
    description: "olko-task-scope-gates runs its scope gate and PATH BUDGET on the worktree diff against the base branch and records the result in the journal."
    kind: llm
    role: orchestrator
    skill: olko-task-scope-gates
    tools: [read, edit, bash]
    dirs: ["{{state.task.task.featureDir}}"]
    parse: { json: [count, docs, paths] }
    prompt: |
      Step 7b, TASK-TO-PR SCOPE GATE and PATH BUDGET only, for Task {{state.task.task.taskName}} of Feature {{state.task.task.featureId}} in this worktree ({{state.worktree.worktree.path}}) against {{state.worktree.worktree.base}}: count the distinct code paths changed from the PR target, committed or not, and the documentation paths separately. Change no code, commit nothing and ask nothing. Record the counts and the gate result in the implementation journal of {{state.task.task.taskFile}}.
      End with one ```json block: {"count": <code-path count>, "docs": <documentation-path count>, "paths": ["<counted code path>"]}
  - id: ask-scope
    description: "More than 15 code paths: extend the budget for this Task, or stop and re-scope."
    kind: interrupt
    question:
      id: q-impl-scope
      text: "The Task diff has {{state.scope-gate.scope-gate.count}} code paths (budget 15):\n{{#state.scope-gate.scope-gate.paths}}{{.}}\n{{/state.scope-gate.scope-gate.paths}}Extend the budget for this Task and PR, or stop and re-scope?"
      allowed: [extend, stop]
  - id: stop-scope
    description: "Stops before commit: the Task must be re-scoped."
    kind: script
    op: builtin.stop
    with: { reason: "Implementation stopped: {{state.scope-gate.scope-gate.count}} code paths (budget 15) and no extension; re-scope the Task." }
edges:
  - { from: scope-gate, to: ask-scope, when: "scope-gate.scope-gate.count > 15", description: "more than 15 code paths" }
  - { from: scope-gate, to: END, description: "15 code paths or fewer" }
  - { from: ask-scope, to: END, when: 'ask-scope.answer == "extend"', description: "you extended the budget" }
  - { from: ask-scope, to: stop-scope, description: "you chose stop" }
