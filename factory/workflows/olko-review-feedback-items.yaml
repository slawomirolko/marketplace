name: olko-review-feedback-items
version: 0.2.0
description: "Reads CI state and unresolved review comments of your own PR, assesses each item and asks one decision per item."
source: "agents/opencode/olko-review-feedback-handler.md (steps 1 to 4: CI state, comments, grouping, assessment and decisions)"
roles:
  feedback: medium
entry: fb-check
limits:
  maxCycleIterations: 3
nodes:
  - id: fb-check
    description: "The feedback handler reads CI checks and unresolved review threads and comments of your own PR, checks the local branch and groups the comments."
    kind: llm
    role: feedback
    agent: olko-review-feedback-handler
    tools: [read, bash]
    parse: { json: [headOk, head, ci, items] }
    prompt: |
      Do only steps 1 to 3 of your workflow for PR #{{input.pr}} in {{input.repo}}. Change no file and post nothing: the factory owns the other steps and asks the user.
      - CI: latest check states (`gh pr checks`).
      - Comments: unresolved, not outdated review threads (`gh api graphql`, reviewThreads with the thread id and the first comment's author, path, line, body, url), plus PR conversation comments not written by the PR author.
      - headOk is false when `git branch --show-current` is not the PR head branch.
      - Group comments that raise the same issue on the same file within 3 lines.
      End with one ```json block:
      {"headOk": <true|false>, "head": "<PR head branch>", "ci": "<name: state, ... or no checks>", "items": [{"index": <0, 1, ...>, "path": "<path or null>", "line": <line or null>, "comments": [{"id": "<review thread id, or comment id>", "kind": "<thread|comment>", "author": "<login>", "url": "<url>", "body": "<text>"}]}]}
  - id: fb-stop
    description: "Stops: the local branch is not the PR head branch."
    kind: script
    op: builtin.stop
    with: { reason: "the local branch is not the PR head branch: check out the PR head branch first" }
  - id: fb-next
    description: "Takes the next review item."
    kind: script
    op: list.next
    maxVisits: 200
    with: { over: fb-check.fb-check.items }
  - id: fb-assess
    description: "The feedback handler restates the comment, checks it against the code and recommends fix, wont-fix or question."
    kind: llm
    role: feedback
    agent: olko-review-feedback-handler
    maxVisits: 200
    parse: text
    prompt: |
      Do only step 4 of your workflow for this one item, and do not change any file: the factory owns the other steps and asks the user.
      PR #{{input.pr}} in {{input.repo}}, item {{state.fb-next.number}} of {{state.fb-next.total}}{{#state.fb-next.item.path}}, {{state.fb-next.item.path}}:{{state.fb-next.item.line}}{{/state.fb-next.item.path}}.

      Comments:
      {{#state.fb-next.item.comments}}
      - {{author}} ({{url}}): {{body}}
      {{/state.fb-next.item.comments}}

      Restate the request in your own words, verify it against the code, and recommend fix, wont-fix (with technical reasoning) or question.
      Reply with one line: `recommend | <fix|wont-fix|question> | <restatement> | <reasoning>`
  - id: fb-decide
    description: "Asks your decision for this item: fix, wont-fix, question or skip."
    kind: interrupt
    maxVisits: 200
    question:
      id: "q-feedback-{{state.fb-next.index}}"
      text: "Review comment {{state.fb-next.number}} of {{state.fb-next.total}}{{#state.fb-next.item.path}} on {{state.fb-next.item.path}}:{{state.fb-next.item.line}}{{/state.fb-next.item.path}}.\nAssessment: {{state.fb-assess.fb-assess}}\nYour decision?"
      allowed: [fix, wont-fix, question, skip]
  - id: fb-record
    description: "The feedback handler records your decision for this item."
    kind: llm
    role: feedback
    agent: olko-review-feedback-handler
    maxVisits: 200
    parse: { json: [decided] }
    prompt: |
      Step 4 of your workflow: record the user's decision for this one item. Change no file.
      Decisions so far:
      {{#state.fb-record.fb-record.decided}}
      - item {{index}}: {{decision}}
      {{/state.fb-record.fb-record.decided}}
      This item: index {{state.fb-next.item.index}}. The user's decision: {{state.fb-decide.answer}}.
      End with one ```json block: {"decided": [<every decision so far, then this one>: {"index": <item index>, "decision": "<fix|wont-fix|question|skip>"}]}
edges:
  - { from: fb-check, to: fb-next, when: "fb-check.fb-check.headOk == true", description: "the local branch is the PR head" }
  - { from: fb-check, to: fb-stop, when: "fb-check.fb-check.headOk == false", description: "the local branch is not the PR head" }
  - { from: fb-next, to: fb-assess, when: "fb-next.done == false", description: "an item is left" }
  - { from: fb-next, to: END, when: "fb-next.done == true", description: "all items decided" }
  - { from: fb-assess, to: fb-decide }
  - { from: fb-decide, to: fb-record }
  - { from: fb-record, to: fb-next }
