name: olko-plan-tracker-context
version: 0.3.0
description: "Reads the Feature with its Epic and child Tasks from the tracker, read only."
source: "agents/opencode/olko-plan-documentation-orchestrator.md (entry gate, read-only Feature context from the tracker); skills/workflow/olko-feature-plan-workflow/workflow.md (step 1: issue context from olko-feature-backlog-writer in read-only context mode)"
roles:
  backlog: medium
entry: context
nodes:
  - id: context
    description: "Backlog writer reads the Feature and every child Task with their acceptance criteria."
    kind: llm
    role: backlog
    agent: olko-feature-backlog-writer
    parse: { json: [feature, tasks, hierarchy] }
    prompt: |
      Mode: context, read-only. Read the Feature {{input.featureId}} with its Epic and every child Task.
      End with one ```json block: {"feature": {"title": "", "goal": "", "criteria": [""]}, "tasks": [{"id": "", "title": "", "criteria": [""]}], "hierarchy": "<the Epic goal, the Feature and every Task with its acceptance criteria as markdown>"}
edges:
  - { from: context, to: END }
