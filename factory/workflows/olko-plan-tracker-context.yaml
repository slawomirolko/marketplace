name: olko-plan-tracker-context
version: 0.1.0
source: agents/opencode/olko-plan-documentation-orchestrator.md (entry gate, read-only Feature context from the tracker)
roles:
  backlog: medium
entry: context
nodes:
  - id: context
    kind: llm
    role: backlog
    agent: olko-feature-backlog-writer
    parse: plan.draft
    prompt: |
      Mode: context, read-only. Read the Feature {{input.featureId}} with its Epic and every child Task.
      End with one ```json block: {"questions": [], "feature": {"title": "", "goal": "", "criteria": [""]}, "tasks": [{"id": "", "title": "", "criteria": [""]}], "text": "<the Feature and Tasks as markdown>"}
edges:
  - { from: context, to: END }
